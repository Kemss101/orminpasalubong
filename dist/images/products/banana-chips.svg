<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Sweetened Banana Chips</title>
  <desc id="desc">Sample product image of banana chips</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE169"/>
      <stop offset="100%" stop-color="#F5C542"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="160" cy="120" r="90" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="670" cy="420" r="110" fill="#ffffff" fill-opacity="0.15"/>
  <text x="400" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#1F2937">BANANA CHIPS</text>
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1F2937">Sweet and Crunchy Pasalubong</text>
</svg>
