<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Premium Coco Jam</title>
  <desc id="desc">Sample product image of coco jam</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CDEFD3"/>
      <stop offset="100%" stop-color="#85C88A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="140" cy="380" r="95" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="650" cy="120" r="80" fill="#ffffff" fill-opacity="0.16"/>
  <text x="400" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#1F2937">COCO JAM</text>
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1F2937">Rich coconut flavor</text>
</svg>
